name: Update Homebrew Tap

# Bumps the whisky-preview cask in dappermint/homebrew-tap to the version and DMG
# sha256 of a published app release, so `brew upgrade --cask whisky-preview` picks
# it up without a manual edit.
#
# Requires a repository secret BREW_TOKEN: a PAT with Contents:write for
# dappermint/homebrew-tap. The default GITHUB_TOKEN cannot push to another repo.
# Without the secret this job fails loudly; run scripts/bump-cask.sh locally instead.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: App release tag to sync (e.g. app-v2026.8.1)
        required: true

permissions:
  contents: read

jobs:
  update-tap:
    # Only app releases; the Wine Libraries stream uses bare vX.Y.Z tags and has no cask.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'app-v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Bump cask to the released version
        env:
          BREW_TOKEN: ${{ secrets.BREW_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "${BREW_TOKEN:-}" ]; then
            echo "::error::BREW_TOKEN secret is not set. Add a PAT with Contents:write for dappermint/homebrew-tap."
            exit 1
          fi

          if ! printf '%s' "$TAG" | grep -qE '^app-v[0-9]+(\.[0-9]+)*$'; then
            echo "::error::'${TAG}' is not an app-vX.Y.Z tag."
            exit 1
          fi
          version="${TAG#app-v}"
          url="https://github.com/dappermint/Whisky/releases/download/${TAG}/Whisky-Preview-${version}.dmg"
          echo "Syncing tap to ${version} from ${url}"

          curl -fSL "$url" -o whisky-preview.dmg
          sha="$(sha256sum whisky-preview.dmg | awk '{print $1}')"

          git clone --depth 1 "https://x-access-token:${BREW_TOKEN}@github.com/dappermint/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/version \"[^\"]+\"/version \"${version}\"/" Casks/whisky-preview.rb
          sed -i -E "s/sha256 \"[0-9a-f]{64}\"/sha256 \"${sha}\"/" Casks/whisky-preview.rb

          # `sed -i` exits 0 even when nothing matched, so assert both edits landed.
          # A partial match would otherwise push the new version with a stale hash and
          # break `brew install` for everyone while this workflow stayed green.
          grep -qF "version \"${version}\"" Casks/whisky-preview.rb \
            || { echo "::error::version line was not updated"; exit 1; }
          grep -qF "sha256 \"${sha}\"" Casks/whisky-preview.rb \
            || { echo "::error::sha256 line was not updated (existing line not 64-lowercase-hex?)"; exit 1; }

          if git diff --quiet; then
            echo "Cask already at ${version}; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "whisky-preview ${version}"
          git push
          echo "Tap updated to whisky-preview ${version}."
